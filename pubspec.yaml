name: world_fantasy_game
description: A multi-game fantasy sports and casual gaming platform with ads and wallet system.
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.9
  firebase_analytics: ^10.7.0
  
  # State Management
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Google Mobile Ads (AdMob)
  google_mobile_ads: ^5.0.0
  
  # Networking
  dio: ^5.3.1
  retrofit: ^4.1.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI/UX
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.6.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  get: ^4.6.5
  
  # Payment & Wallet
  razorpay_flutter: ^1.3.7
  
  # Image Picker
  image_picker: ^1.0.4
  
  # Device Info
  device_info_plus: ^9.1.1
  connectivity_plus: ^5.0.1
  
  # Logging
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_linter: ^3.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  retrofit_generator: ^7.0.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
